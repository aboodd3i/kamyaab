name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Prevent concurrent runs on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Type-Check, Unit Test, Build
    runs-on: ubuntu-latest

    env:
      # Prisma CLI needs DIRECT_URL for config; use a dummy value for CI
      # since we only validate/generate, not migrate.
      DIRECT_URL: postgresql://dummy:dummy@localhost:5432/dummy
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_ANON_KEY: dummy-anon-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Prisma schema formatting
        run: npx prisma format --check

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript type checking
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Check for uncommitted changes
        run: |
          if ! git diff --check; then
            echo "::error::Whitespace or merge-conflict marker issues detected"
            exit 1
          fi

  # ── Integration tests with real PostgreSQL ──────────────────────────────
  integration:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kamyaab
          POSTGRES_PASSWORD: kamyaab_ci
          POSTGRES_DB: kamyaab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kamyaab -d kamyaab_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://kamyaab:kamyaab_ci@localhost:5432/kamyaab_test
      DIRECT_URL: postgresql://kamyaab:kamyaab_ci@localhost:5432/kamyaab_test
      SUPABASE_URL: https://dummy.supabase.co
      SUPABASE_ANON_KEY: dummy-anon-key
      RUN_DB_INTEGRATION_TESTS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Run integration tests
        run: npx vitest run --no-file-parallelism src/__tests__/*.integration.test.ts
